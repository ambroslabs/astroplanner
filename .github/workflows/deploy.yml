name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://astroplanner.ambroslabs.io
    steps:
      - uses: actions/checkout@v4

      # The root is always built from main, whichever branch set this running.
      # Building it from the triggering ref meant a push to beta deployed beta
      # over the top of the page people are using, which is the one thing the
      # split exists to prevent.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .main-src

      # Assembles dist/. No CF_WEB_ANALYTICS_TOKEN is passed on purpose: this
      # site is covered by Cloudflare Web Analytics *automatic* installation on
      # the ambroslabs.io zone, so the edge already injects a beacon into every
      # HTML response. Injecting a second one here double-instruments the page
      # and breaks both - see scripts/build.sh. Forks deploying elsewhere can
      # still set the variable to get a manually installed beacon.
      - name: Build
        env:
          BUILD_SRC: ${{ github.workspace }}/.main-src
          BUILD_OUT: ${{ github.workspace }}/dist
        run: bash .main-src/scripts/build.sh

      # /beta is a second, complete copy of the site built from the beta
      # branch, so an experiment can be deployed and looked at without touching
      # the page people are using. Both branches trigger this workflow and both
      # halves are rebuilt every time, because Pages replaces the whole tree on
      # each deployment - building only the branch that changed would delete
      # the other one.
      #
      # It is built by the beta branch's own build script against its own
      # assets rather than sharing the root's. A change to a catalogue changes
      # its file name, so a shared asset tree would mean beta could only ever
      # test the data main already had.
      - name: Check out the beta branch
        id: betasrc
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: beta
          path: .beta-src

      - name: Build /beta
        env:
          BUILD_OUT: ${{ github.workspace }}/dist/beta
          BUILD_WORKER: '0'
          BUILD_BETA: '1'
        run: |
          if [ -f .beta-src/scripts/build.sh ]; then
            BUILD_SRC="$GITHUB_WORKSPACE/.beta-src" bash .beta-src/scripts/build.sh
          else
            echo "no beta branch yet - /beta gets a copy of main"
            ./scripts/build.sh
          fi

      # One catalogue directory for both copies. The names are content hashes,
      # so merging is safe: identical data collides on the same name and stays
      # one file with one URL, which is what stops a reader downloading the
      # same 96 KB twice for two copies of the same page. Data that differs
      # lands under a different name and both survive.
      - name: Share one catalogue directory between / and /beta
        run: |
          if [ -d dist/beta/assets/catalogs ]; then
            cp -n dist/beta/assets/catalogs/*.txt dist/assets/catalogs/ 2>/dev/null || true
            rm -rf dist/beta/assets/catalogs
          fi
          echo "catalogue files served: $(ls dist/assets/catalogs | wc -l)"

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=astroplanner --branch=main
